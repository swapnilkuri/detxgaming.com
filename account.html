<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account | Detx Gaming</title>
  <link rel="stylesheet" href="assets/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-gray-200 min-h-screen">

  <!-- Header -->
  <header class="border-b border-zinc-800 bg-zinc-950 p-4">
    <div class="container mx-auto flex justify-between items-center max-w-4xl">
      <a href="index.html" class="font-bold text-white text-xl">← Back to Store</a>
      <button onclick="handleLogout()" class="bg-red-500/10 text-red-400 hover:bg-red-500 hover:text-white px-4 py-2 rounded-lg text-sm font-semibold transition">
        Logout
      </button>
    </div>
  </header>

  <main class="container mx-auto max-w-4xl p-6 mt-8">
    <h1 class="text-3xl font-bold text-white mb-8">My Account</h1>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
      <!-- Profile Details -->
      <div class="md:col-span-1 space-y-6">
        <div class="bg-zinc-900 border border-zinc-800 p-6 rounded-xl">
          <h2 class="text-lg font-bold text-yellow-400 mb-4">Profile Details</h2>
          <form id="profileForm" class="space-y-4">
            <div>
              <label class="block text-xs text-gray-400 uppercase mb-1">Email</label>
              <input type="email" id="acc-email" disabled class="w-full bg-black border border-zinc-700 p-2 rounded text-gray-500 cursor-not-allowed" />
            </div>
            <div>
              <label class="block text-xs text-gray-400 uppercase mb-1">Full Name</label>
              <input type="text" id="acc-name" class="w-full bg-black border border-zinc-700 p-2 rounded text-white" />
            </div>
            <div>
              <label class="block text-xs text-gray-400 uppercase mb-1">Phone</label>
              <input type="text" id="acc-phone" class="w-full bg-black border border-zinc-700 p-2 rounded text-white" />
            </div>
            <button type="submit" class="w-full bg-yellow-500 hover:bg-yellow-400 text-black font-bold py-2 rounded transition">Update Profile</button>
          </form>
        </div>

        <!-- Security -->
        <div class="bg-zinc-900 border border-zinc-800 p-6 rounded-xl">
          <h2 class="text-lg font-bold text-white mb-4">Security</h2>
          <form id="passwordForm" class="space-y-4">
            <div>
              <label class="block text-xs text-gray-400 uppercase mb-1">New Password</label>
              <input type="password" id="new-password" required minlength="6" class="w-full bg-black border border-zinc-700 p-2 rounded text-white" />
            </div>
            <button type="submit" class="w-full border border-zinc-700 hover:bg-zinc-800 text-white font-bold py-2 rounded transition">Change Password</button>
          </form>
        </div>
      </div>

      <!-- Order History -->
      <div class="md:col-span-2">
        <div class="bg-zinc-900 border border-zinc-800 p-6 rounded-xl">
          <h2 class="text-xl font-bold text-white mb-4">My Courses & Orders</h2>
          <div id="my-orders-list" class="space-y-4">
            <p class="text-gray-500 text-sm">Loading your orders...</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="assets/supabase.js"></script>
  <script>
    // Account Logic
    document.addEventListener("DOMContentLoaded", async () => {
      const sb = getSupabase();
      const { data: { session }, error } = await sb.auth.getSession();
      
      if (!session) {
        window.location.href = "login.html";
        return;
      }

      const user = session.user;
      document.getElementById('acc-email').value = user.email;

      // Load Profile
      const { data: profile } = await sb.from('profiles').select('*').eq('id', user.id).single();
      if (profile) {
        document.getElementById('acc-name').value = profile.full_name || '';
        document.getElementById('acc-phone').value = profile.phone || '';
      }

      // Load Orders
      const { data: orders } = await sb.from('orders').select('*').eq('customer_email', user.email).order('created_at', { ascending: false });
      const ordersList = document.getElementById('my-orders-list');
      
      if (!orders || orders.length === 0) {
        ordersList.innerHTML = `<p class="text-gray-500 text-sm">You haven't purchased any courses yet.</p>`;
      } else {
        ordersList.innerHTML = orders.map(o => `
          <div class="border border-zinc-800 bg-black p-4 rounded-lg flex justify-between items-center">
            <div>
              <p class="text-xs text-gray-500 mb-1">Order #${o.order_number || o.id.slice(0,8).toUpperCase()} • ${new Date(o.created_at).toLocaleDateString()}</p>
              <h4 class="font-bold text-yellow-400">৳${o.total_amount}</h4>
            </div>
            <span class="px-3 py-1 rounded text-xs font-bold ${o.payment_status === 'Paid' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-yellow-500/20 text-yellow-400'}">${o.payment_status}</span>
          </div>
        `).join('');
      }

      // Update Profile
      document.getElementById('profileForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const full_name = document.getElementById('acc-name').value;
        const phone = document.getElementById('acc-phone').value;
        
        await sb.from('profiles').upsert({ id: user.id, email: user.email, full_name, phone });
        alert("Profile updated successfully!");
      });

      // Change Password
      document.getElementById('passwordForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const newPassword = document.getElementById('new-password').value;
        const { error } = await sb.auth.updateUser({ password: newPassword });
        if (error) alert("Error: " + error.message);
        else {
          alert("Password updated successfully!");
          document.getElementById('passwordForm').reset();
        }
      });
    });

    async function handleLogout() {
      await getSupabase().auth.signOut();
      window.location.href = "login.html";
    }
  </script>
</body>
</html>
