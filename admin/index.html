<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CMS Admin Dashboard</title>
  <link rel="stylesheet" href="../assets/style.css">
  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white min-h-screen p-6">

  <!-- Header -->
  <header class="mb-8 border-b border-zinc-800 pb-4">
    <span class="text-yellow-500 font-bold text-xs uppercase tracking-widest">CMS Admin</span>
    <h1 class="text-3xl font-bold text-white mt-1">Dashboard Manager</h1>
  </header>

  <!-- Navigation Tabs -->
  <div class="flex gap-4 border-b border-zinc-800 mb-6">
    <button onclick="switchTab('enrollments')" id="btn-enrollments" class="tab-btn pb-2 text-yellow-400 border-b-2 border-yellow-400 font-semibold">
      Enrollments
    </button>
    <button onclick="switchTab('courses')" id="btn-courses" class="tab-btn pb-2 text-gray-400 hover:text-white font-semibold">
      Courses
    </button>
    <button onclick="switchTab('messages')" id="btn-messages" class="tab-btn pb-2 text-gray-400 hover:text-white font-semibold">
      Messages
    </button>
  </div>

  <!-- Tab 1: Enrollments Section -->
  <section id="tab-enrollments" class="tab-content">
    <h2 class="text-xl font-bold mb-4">Student Enrollments</h2>
    <div class="overflow-x-auto bg-zinc-900 border border-zinc-800 rounded-xl p-4">
      <table class="w-full text-left text-sm text-gray-300">
        <thead class="text-xs uppercase bg-zinc-800 text-yellow-400">
          <tr>
            <th class="p-3">Name</th>
            <th class="p-3">Email</th>
            <th class="p-3">Phone</th>
            <th class="p-3">Course</th>
            <th class="p-3">Payment</th>
          </tr>
        </thead>
        <tbody id="enrollments-list">
          <tr><td colspan="5" class="p-4 text-center text-gray-500">Loading enrollments...</td></tr>
        </tbody>
      </table>
    </div>
  </section>

  <!-- Tab 2: Course Manager Section -->
  <section id="tab-courses" class="tab-content hidden">
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-xl font-bold">Manage Courses</h2>
      <button onclick="toggleCourseForm()" class="bg-yellow-500 hover:bg-yellow-400 text-black font-bold px-4 py-2 rounded-lg text-sm">
        + Add New Course
      </button>
    </div>

    <!-- Add Course Form -->
    <form id="course-form" class="hidden bg-zinc-900 border border-zinc-800 p-6 rounded-xl mb-6 space-y-4">
      <h3 class="text-lg font-bold text-yellow-400">Add New Course</h3>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <input type="text" id="course-title" placeholder="Course Title" class="bg-black border border-zinc-700 p-3 rounded text-white" required />
        <input type="text" id="course-slug" placeholder="Slug (e.g. youtube-mastery)" class="bg-black border border-zinc-700 p-3 rounded text-white" required />
        <input type="number" id="course-price" placeholder="Price (₹)" class="bg-black border border-zinc-700 p-3 rounded text-white" required />
        <input type="text" id="course-thumb" placeholder="Thumbnail URL (e.g. assets/courses/1-minute-thumbnail-method.png)" class="bg-black border border-zinc-700 p-3 rounded text-white" required />
      </div>
      <textarea id="course-desc" placeholder="Course Description" class="w-full bg-black border border-zinc-700 p-3 rounded text-white" rows="3" required></textarea>
      <button type="submit" class="bg-yellow-500 text-black font-bold px-6 py-2 rounded-lg">Save Course</button>
    </form>

    <div id="courses-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <!-- Dynamic courses load here -->
    </div>
  </section>

  <!-- Tab 3: Messages Section -->
  <section id="tab-messages" class="tab-content hidden">
    <h2 class="text-xl font-bold mb-4">Contact Messages</h2>
    <div class="overflow-x-auto bg-zinc-900 border border-zinc-800 rounded-xl p-4">
      <table class="w-full text-left text-sm text-gray-300">
        <thead class="text-xs uppercase bg-zinc-800 text-yellow-400">
          <tr>
            <th class="p-3">Name</th>
            <th class="p-3">Email</th>
            <th class="p-3">Subject</th>
            <th class="p-3">Message</th>
          </tr>
        </thead>
        <tbody id="messages-list">
          <tr><td colspan="4" class="p-4 text-center text-gray-500">Loading messages...</td></tr>
        </tbody>
      </table>
    </div>
  </section>

  <script src="../assets/supabase.js"></script>
  <script src="../assets/admin.js"></script>
</body>
</html>
