<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authentication - Detx Gaming</title>
  <link rel="stylesheet" href="./assets/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white flex items-center justify-center min-h-screen p-4">

  <div class="w-full max-w-md bg-zinc-950 border border-amber-500/20 rounded-2xl p-8 shadow-2xl">
    
    <!-- Header -->
    <div class="text-center mb-6">
      <h1 id="auth-title" class="text-3xl font-serif font-bold text-amber-200">Welcome Back</h1>
      <p id="auth-sub" class="text-sm text-zinc-400 mt-1">Sign in to continue your learning journey</p>
    </div>

    <!-- Google Login Button -->
    <button onclick="loginWithGoogle()" class="w-full flex items-center justify-center gap-3 bg-zinc-900 border border-zinc-800 hover:border-zinc-700 py-3 rounded-full text-sm font-medium mb-5 transition">
      <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.3 9 5 12 5z"/><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/><path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 10.8 0 12.3s.7 2.6 1.9 5l3.7-2.5z"/><path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.3-6.4-5.2L1.9 16C3.7 19.7 7.5 23 12 23z"/></svg>
      Continue with Google
      <!-- Add this return button inside your login container or header in login.html -->
<div style="position: absolute; top: 20px; left: 20px;">
  <a href="index.html" class="bg-zinc-900 border border-zinc-800 text-white px-4 py-2 rounded-lg text-sm hover:border-zinc-700 transition flex items-center gap-2">
    ← Return to Home
  </a>
</div>
    </button>

    <div class="flex items-center my-4">
      <hr class="flex-grow border-zinc-800">
      <span class="px-3 text-xs text-zinc-500 uppercase">or</span>
      <hr class="flex-grow border-zinc-800">
    </div>

    <!-- Auth Form -->
    <form id="auth-form" class="space-y-4">
      <div id="fullname-field" class="hidden">
        <label class="block text-xs font-semibold text-zinc-300 mb-1">Full Name</label>
        <input type="text" id="full-name" placeholder="Your full name" class="w-full bg-zinc-900 border border-zinc-800 focus:border-amber-500/50 p-3 rounded-xl text-sm text-white outline-none" />
      </div>

      <div>
        <label class="block text-xs font-semibold text-zinc-300 mb-1">Email Address</label>
        <input type="email" id="email" placeholder="your.email@example.com" class="w-full bg-zinc-900 border border-zinc-800 focus:border-amber-500/50 p-3 rounded-xl text-sm text-white outline-none" required />
      </div>

      <div>
        <label class="block text-xs font-semibold text-zinc-300 mb-1">Password</label>
        <input type="password" id="password" placeholder="••••••••••••" class="w-full bg-zinc-900 border border-zinc-800 focus:border-amber-500/50 p-3 rounded-xl text-sm text-white outline-none" required />
      </div>

      <button type="submit" id="submit-btn" class="w-full bg-gradient-to-r from-amber-400 to-amber-600 hover:opacity-90 text-black font-bold py-3 rounded-full text-sm transition mt-2 shadow-lg shadow-amber-500/10">
        Sign In
      </button>
    </form>

    <!-- Toggle Mode -->
    <div class="text-center mt-6 text-xs text-zinc-400">
      <span id="toggle-text">Do not have an account?</span>
      <button onclick="toggleAuthMode()" id="toggle-btn" class="text-amber-400 font-semibold ml-1 hover:underline">Sign up</button>
    </div>

  </div>

  <script src="./assets/supabase.js"></script>
  <script src="./assets/auth.js"></script>
</body>
</html>
